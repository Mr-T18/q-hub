<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Q-HUB - 高専生のためのクイズ共有ハブ">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Q-HUB</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* スプラッシュ画面のスタイル（変更なし） */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background-color: #ffffff; z-index: 9999;
      transition: opacity 0.6s ease-out;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    .logo { width: 100px; height: 100px; }
  </style>
</head>
<body>
  <div id="splash">
    <img class="logo" src="assets/assets/images/logo.png" 
         onerror="this.src='assets/images/logo.png'; this.onerror=null;" alt="Logo">
  </div>

  <script>
    // スプラッシュを消す関数
    window.hideSplash = function() {
      const splash = document.getElementById('splash');
      if (splash && !splash.classList.contains('fade-out')) {
        console.log("Q-HUB: Hiding splash screen...");
        splash.classList.add('fade-out');
        setTimeout(() => { if (document.body.contains(splash)) splash.remove(); }, 650);
      }
    };

    // ★重要：Flutter 3.22以降の「正しい」カスタマイズ方法
    // flutter_bootstrap.js が読み込まれる前に設定を注入します
    window.didCreateEngineInitializer = function(engineInitializer) {
      engineInitializer.initializeEngine({
        renderer: "html", // ここでHTMLレンダラーを強制
      }).then(function(appRunner) {
        appRunner.runApp().then(function() {
          // アプリの描画が始まったらスプラッシュを消す
          window.hideSplash();
        });
      });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // バックアップ：15秒経っても消えなければ強制削除
    setTimeout(() => window.hideSplash(), 15000);
  </script>
</body>
</html>
